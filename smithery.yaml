# Smithery deployment config — https://smithery.ai/docs
# Local stdio server distributed via npm; Smithery runs it through npx.
# This distribution leaves live audit tools unconfigured, so they return a
# configuration error. Use a locally controlled MCP client for bearer access.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction: |-
    () => ({
      command: 'npx',
      args: ['-y', 'mcp-kinetic-gain']
    })
  exampleConfig: {}
