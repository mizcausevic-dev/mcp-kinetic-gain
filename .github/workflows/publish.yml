name: Publish to npm

# A tag is eligible only when its commit is already on main. Verification runs
# without write permissions. OIDC publication and GitHub Release writes happen
# in separate jobs after the exact tarball has been tested and checksummed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit without persisting credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require this tag commit to be on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::Tag commit is not on main. Merge the reviewed commit before tagging."
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify tag, package, and Registry manifest versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          EXPECTED="$tag_version" node -e 'const p=require("./package.json"),s=require("./server.json"),q=s.packages?.[0],v=process.env.EXPECTED; if(p.version!==v || s.version!==v || q?.version!==v || q?.identifier!==p.name || s.name!==p.mcpName) process.exit(1)'
          echo "Tag v${tag_version} matches package and Registry manifest."

      - name: Require an unused npm version
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/mcp-kinetic-gain/${version}?check=${GITHUB_RUN_ID}")
          if [ "$status" != "404" ]; then
            echo "::error::Expected unpublished version (HTTP 404); registry returned HTTP ${status}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies and registry signatures
        run: |
          npm audit --audit-level=high
          npm audit signatures

      - name: Typecheck, test, and build
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --sbom-type library > sbom/cyclonedx.json
          node -e 'const s=require("./sbom/cyclonedx.json"); if(s.bomFormat!=="CycloneDX" || !Array.isArray(s.components)) process.exit(1); console.log("SBOM components:",s.components.length)'

      - name: Pack and inventory the exact release tarball
        run: |
          mkdir -p release
          npm pack --ignore-scripts --json --pack-destination release > pack.json
          node -e 'const p=require("./package.json"),d=require("./pack.json"); if(d.length!==1 || d[0].name!==p.name || d[0].version!==p.version || d[0].files.some(f=>!f.path.startsWith("dist/") && !["README.md","LICENSE","package.json","docs/SECURE_HTTP_PILOT.md"].includes(f.path))) process.exit(1); console.log("Package files:",d[0].files.length)'
          cp sbom/cyclonedx.json release/cyclonedx.json
          (cd release && sha256sum ./*.tgz > package.sha256 && sha256sum cyclonedx.json > sbom.sha256)

      - name: Upload verified release materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-materials
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Download verified release materials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-materials
          path: release/

      - name: Check artifact integrity
        run: |
          (cd release && sha256sum --check --strict package.sha256 && sha256sum --check --strict sbom.sha256)
          version="${GITHUB_REF_NAME#v}"
          test -f "release/mcp-kinetic-gain-${version}.tgz"

      - name: Install an OIDC-capable npm CLI
        run: npm install -g --ignore-scripts npm@11.19.0 && npm --version

      - name: Publish the tested tarball with provenance
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release/mcp-kinetic-gain-${version}.tgz" --provenance --access public --ignore-scripts

      - name: Verify the public npm package and provenance
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/mcp-kinetic-gain/${expected}?check=${attempt}" \
              -o published-package.json && \
              EXPECTED="$expected" node -e 'const fs=require("fs"),crypto=require("crypto"),d=require("./published-package.json"),v=process.env.EXPECTED,b=fs.readFileSync(`release/mcp-kinetic-gain-${v}.tgz`),integrity="sha512-"+crypto.createHash("sha512").update(b).digest("base64"); process.exit(d.name==="mcp-kinetic-gain" && d.version===v && d.dist?.integrity===integrity && Boolean(d.dist?.attestations?.provenance) ? 0 : 1)'; then
              echo "npm published=mcp-kinetic-gain@${expected} with matching tarball integrity and provenance"
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm did not report mcp-kinetic-gain@${expected} with provenance after publish"
          exit 1

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release materials
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-materials
          path: release/

      - name: Check SBOM integrity
        run: (cd release && sha256sum --check --strict sbom.sha256)

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/cyclonedx.json --clobber
          else
            gh release create "$TAG" release/cyclonedx.json --title "$TAG" --notes "See CHANGELOG.md. Workspace dependency SBOM attached (CycloneDX)."
          fi
