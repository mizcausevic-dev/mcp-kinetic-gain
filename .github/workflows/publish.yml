name: Publish to npm

# Triggered on tag pushes matching v*. The convention is:
#   1. Bump version in package.json + CHANGELOG.md
#   2. git commit
#   3. git tag vX.Y.Z
#   4. git push && git push --tags
# This workflow then runs the test suite, verifies the tag matches the
# package.json version, and publishes to npm with provenance.

on:
  push:
    tags:
      - 'v*'

# npm provenance requires id-token: write so the GitHub OIDC token can be
# minted and submitted to Sigstore as the attestation subject.
# contents: write is required to attach SBOM artifact to the GitHub Release.
permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v${tag_version} does not match package.json version ${pkg_version}."
            echo "Bump package.json to ${tag_version} before tagging, or retag with v${pkg_version}."
            exit 1
          fi
          echo "Tag v${tag_version} matches package.json. Proceeding."

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: |
          # CycloneDX 1.5 SBOM for the published mcp-kinetic-gain artifact.
          # Captures the dep tree (with TypeScript compiler + MCP SDK at the
          # top of the chain) for downstream auditors.
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --sbom-type library > sbom/cyclonedx.json
          node -e "const s=require('./sbom/cyclonedx.json'); console.log('SBOM:', s.bomFormat, s.specVersion, '·', (s.components||[]).length, 'components');"

      - name: Ensure npm supports the OIDC trusted-publishing handshake
        # Node 20 bundles an npm CLI too old for the OIDC handshake that
        # `--provenance` publishing now requires against the registry. When
        # that handshake fails, the registry silently treats the request as
        # anonymous, which cannot PUT -- and the resulting error is a
        # misleading 404 ("'pkg@x.y.z' is not in this registry") rather than
        # a clear auth failure, on a package that demonstrably already
        # exists. Confirmed against this exact repo: the Sigstore provenance
        # attestation step succeeded, then the actual publish PUT 404'd,
        # twice, byte-for-byte identical on a rerun -- ruling out a
        # transient registry blip. Fix is npm >=11.5.1; pinning to `latest`
        # here rather than a bare version so this keeps working as the OIDC
        # requirement floor moves.
        # Pinned to the 11.x line, not `latest`: npm 12 requires Node
        # >=22.22, which this job's Node 20 setup does not satisfy, so
        # `npm@latest` fails its own EBADENGINE check before it can even
        # install (confirmed: the first attempt at this fix used `latest`
        # and failed exactly this way). Every 11.x release needs Node
        # ^20.17.0 || >=22.9.0, which Node 20.20.2 satisfies, and 11.x
        # already includes the OIDC fix (floor is 11.5.1; this resolves
        # to the newest 11.x, currently 11.19.0).
        run: npm install -g npm@11 && npm --version

      - name: Publish to npm with provenance
        # No NPM_TOKEN. npm is deprecating 2FA-bypass tokens for direct
        # publishing (the "npm tokens that bypass 2FA are being restricted"
        # notice, confirmed on this exact repo 2026-09-12: the classic
        # NODE_AUTH_TOKEN flow signed provenance fine, then 404'd on the
        # actual PUT). id-token: write above is what this needs instead --
        # npm's OIDC Trusted Publisher flow, no token, no OTP, ever. Requires
        # this repo + this workflow filename registered as a Trusted
        # Publisher on the npm package's Publishing access settings; if that
        # registration is missing this step fails with the same E404.
        run: npm publish --provenance --access public

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom/cyclonedx.json --clobber
          else
            gh release create "$TAG" sbom/cyclonedx.json --title "$TAG" --notes "See CHANGELOG.md. SBOM attached (CycloneDX 1.5)."
          fi
